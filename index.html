<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>螺丝小屋 · 拆家解压小游戏</title>
<style>
:root{color-scheme:light;--ink:#593d2d;--ink-dark:#3c2d24;--cream:#fff7e4;--paper:#fffaf0;--sky:#91d7eb;--wood:#f3cb8b;--wood-edge:#ab713c;--green:#4b9b76;--orange:#e89a4f;--font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-family:var(--font);color:var(--ink-dark);background:#dbebe8;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-width:300px;min-height:100svh;background:radial-gradient(ellipse at 15% 10%,#f0f3e8 0,transparent 45%),radial-gradient(ellipse at 85% 95%,#d0e4dd 0,transparent 50%),#dcece9}
button{font:inherit;cursor:pointer;color:inherit;border:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default}
.icon-bank{position:absolute;width:0;height:0;overflow:hidden}
.icon{display:inline-block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex-shrink:0}
.playground{width:100%;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:18px 16px 12px}
.desktop-note{display:flex;align-items:center;gap:15px;color:#73867a;font-size:11px;letter-spacing:3px;margin:2px 0 18px}
.note-rule{display:block;width:25px;height:1px;background:#a7b9ab}
.game-shell{width:min(480px,100%);background:var(--sky);border:2px solid #688c91;border-radius:28px;overflow:hidden;box-shadow:0 8px 0 #b5cfc9,0 20px 45px #4768631c;position:relative}
.game-header{padding:12px 20px 3px;position:relative;z-index:3;background:#91d7eb}
.brand-row{height:25px;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.brand{font-weight:800;letter-spacing:2px;font-size:16px;color:#49636c}
.brand-stamp{font-size:9px;letter-spacing:1px;display:inline-block;margin-left:9px;padding:2px 5px;border:1px solid #679cad;border-radius:4px;vertical-align:2px;font-weight:500}
.text-button{padding:2px;background:transparent;color:#497a89}
.help-button .icon{width:21px;height:21px}
.level-row{height:64px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:22px}
.round-button{height:44px;width:44px;border-radius:15px;border:2px solid #aa7438;background:#ffd67b;box-shadow:inset 0 2px 0 #fff0b2,0 3px 0 #b67d43;display:grid;place-items:center;color:#916320;transition:transform .15s,box-shadow .15s}
.round-button:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #ffffff60,0 0 0 transparent}
.level-plaque{height:59px;border:2px solid #ad7840;position:relative;border-radius:9px 9px 15px 15px;background:#ffdda0;box-shadow:inset 0 3px 0 #ffefbd,0 4px 0 #c28c48;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.level-plaque:before,.level-plaque:after{content:"";width:5px;height:22px;border:1px solid #9e723e;background:repeating-linear-gradient(to bottom,#f6c36e 0 5px,#9e723e 5px 7px);position:absolute;top:-14px;border-radius:3px}
.level-plaque:before{left:15px}
.level-plaque:after{right:15px}
.level-plaque>span{font-weight:900;font-size:24px;letter-spacing:5px;margin-left:5px;text-shadow:0 2px 0 #fff2cf}
.level-plaque small{font-size:10px;letter-spacing:2px;color:#8a653a}
.room-button{width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:transparent;color:#c87941}
.room-button>.icon{width:35px;height:35px;fill:#fff2ca;stroke-width:1.8;filter:drop-shadow(0 2px 0 #ffffff90)}
.room-button>span{font-weight:800;font-size:10px;line-height:17px;background:#527e87;color:#fff8e4;border-radius:10px;min-width:45px;padding:0 4px;margin-top:3px}
.progress-row{display:flex;gap:8px;align-items:center;width:65%;margin:12px auto 0}
.progress-track{height:9px;background:#6eb7cd;border:1px solid #5a9bad;border-radius:8px;overflow:hidden;flex:1;box-shadow:inset 0 1px 1px #3d7a8b30}
.progress-track>span{display:block;width:0;height:100%;background:#fff0a4;border-radius:8px;transition:width .3s}
.progress-row>span{font-size:10px;font-weight:800;color:#3f6974;min-width:29px;text-align:right}
.progress-text{font-size:12px;font-weight:800;color:#3f6974;text-align:center;margin:6px 0 0;letter-spacing:1px}
.goal-line{margin:8px 0 2px;text-align:center;font-size:11px;line-height:1.5;color:#365d65}
.board-hint{min-height:44px;position:relative;margin:5px 10px;font-size:15px;font-weight:700;line-height:1.5;padding:8px 10px;border-radius:12px;background:#f5f9e9ed;color:#466b6b;text-align:center;pointer-events:none}
.board-space{width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.board-surface{width:100%;aspect-ratio:480/620;position:relative;overflow:hidden;background:#91d7eb}
#gameCanvas{display:block;width:100%;height:100%;touch-action:manipulation}
.inline-status{position:absolute;left:50%;transform:translateX(-50%);bottom:4%;width:max-content;max-width:90%;background:#fff8e8ef;color:#694a31;border:1px solid #b78c63;border-radius:20px;padding:7px 15px;font-size:12px;font-weight:700;box-shadow:0 2px 0 #6546311c;pointer-events:none;opacity:0;transition:opacity .2s;z-index:5}
.inline-status.visible{opacity:1}
.tray-reading{background:#fff0cc;border-top:1px solid #b48b50;padding:8px 12px;color:#573b27}
.tray-reading p{margin:3px 0;text-align:center;line-height:1.5}
.tray-rule{font-size:12px}
#trayStatus{font-size:15px;font-weight:800}
#trayStatus.danger{color:#8d271d;background:#fff8e7;border:2px solid #aa422d;border-radius:8px;padding:5px}
.game-footer{position:relative;background:#f8db9c;border-top:2px solid #a97c4b;box-shadow:inset 0 3px 0 #ffebbd;padding:11px 15px 9px;z-index:4}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 4px}
.tool-button{padding:0;background:none;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:13px;font-weight:800;letter-spacing:1px}
.tool-button small{font-size:9px;line-height:11px;letter-spacing:0;color:#8e7048;font-weight:500;margin-top:-3px;min-height:15px}
.tool-button:disabled{opacity:.45}
.tool-face{position:relative;display:grid;place-items:center;width:55px;height:47px;border-radius:16px;border:2px solid #7e653e;box-shadow:inset 0 2px 0 #fff6,0 3px 0 #b18c4e;transition:transform .15s,box-shadow .15s}
.prop-badge{position:absolute;top:-8px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:#e2574c;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:1.5px solid #fff7e4;box-shadow:0 1px 0 #a03328;padding:0 4px;font-style:normal;line-height:1}
.prop-badge.zero{background:#b3a48c;box-shadow:0 1px 0 #8a7a60}
.sweep-face{background:#cfe0f5;border-color:#5f7ea8;color:#3c567a}
.peek-face{background:#e4d6f2;border-color:#8a6bb0;color:#5f3f85}
.tool-button:active .tool-face{transform:translateY(3px);box-shadow:inset 0 2px 0 #ffffff60,0 0 0 transparent}
.tool-face>.icon{width:28px;height:28px;stroke-width:2.1}
.undo-face{background:#f9cc76;border-color:#b28743;color:#7a5426}
.hint-face{background:#fff3c2;border-color:#b28743;color:#7a5426}
.shuffle-face{background:#cfe9e4;border-color:#5e9188;color:#3d6b62}
.footer-meta{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #d9b77c;padding-top:8px;margin-top:11px;font-size:10px;color:#90724b;font-variant-numeric:tabular-nums}
.offline-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:11px;color:#90724b}
.offline-row button{border:1px solid #a57f45;background:#fff4da;border-radius:9px;padding:6px 10px;font-size:12px;color:#7a5426}
.below-game{margin-top:14px;font-size:11px;color:#73867a;text-align:center}
.below-game span{margin-left:8px;opacity:.8}
dialog{border:0;padding:0;border-radius:22px;box-shadow:0 10px 40px #2d412940;width:min(430px,92vw);max-height:86svh;background:var(--paper);color:var(--ink-dark)}
dialog::backdrop{background:#3c4b4866}
.dialog-inner{padding:26px 25px 24px;position:relative}
.dialog-close{position:absolute;top:13px;right:13px;width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:#eee2cc;color:#96764e;z-index:2}
.dialog-close .icon{width:17px;height:17px}
.dialog-kicker{text-align:center;font-size:10px;letter-spacing:3px;color:#ae8451;margin:4px 0 9px}
.dialog-inner h1{font-size:26px;letter-spacing:2px;text-align:center;margin:4px 0 12px;font-weight:900}
.dialog-inner h2{font-size:14px;margin:20px 0 10px}
.dialog-subtitle{font-size:13px;line-height:1.8;color:#90765a;text-align:center;margin:0 0 20px}
.dialog-mascot{display:block;margin:0 auto 7px;font-size:52px;text-align:center;line-height:1.2}
.tutorial-list{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:12.5px;line-height:1.75}
.tutorial-list li{display:flex;gap:9px}
.tutorial-list li:before{content:attr(data-n);flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#f6c36e;color:#6c4d25;font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:2px}
.fine-print{font-size:11px;color:#766044;text-align:center;line-height:1.7;margin:12px 0 0}
.sequence-demo{background:#edf0dd;padding:15px 8px;border-radius:13px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.sequence-demo .dot{width:34px;height:34px;border-radius:50%;border:2px solid #73523d;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.sequence-demo em{font-size:12px;font-style:normal;margin-left:4px;color:#75513f}
.pattern-key{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12px;line-height:2}
.pattern-key span{padding:2px 7px;background:#f4e6ca;border-radius:6px}
.button{min-height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:750;letter-spacing:1px;padding:10px 16px;border:1.5px solid #ac8454;background:#f0dfbc;box-shadow:0 3px 0 #d1ba91;transition:transform .1s,box-shadow .1s;color:var(--ink-dark)}
.button:active{transform:translateY(2px);box-shadow:0 1px 0 #d1ba91}
.button.primary{background:#7dbb89;color:#224d36;border-color:#558562;box-shadow:inset 0 2px 0 #c8e2af,0 3px 0 #558562}
.button.gold{background:#f9cc76;color:#6c4d25;border-color:#b28743;box-shadow:inset 0 2px 0 #fff0b8,0 3px 0 #b28743}
.button.soft{background:#fff8e9;box-shadow:none;border-color:#ddc9a8;color:#846649;font-weight:600}
.button .icon{width:19px;height:19px}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.action-row .button{padding:10px 7px;font-size:12px;letter-spacing:0}
.modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.chapter-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0 4px}
.chapter-nav>button{width:32px;height:36px;border-radius:9px;background:#efdcb8;color:#735132;font-size:26px;flex-shrink:0}
.chapter-nav>button:disabled{opacity:.3}
.chapter-nav>div{text-align:center}
.chapter-nav strong{font-size:15px}
.chapter-nav small{font-size:11px;display:block;color:#8a7155;margin-top:6px}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}
.level-tile{aspect-ratio:1;border-radius:12px;border:1.5px solid #c6a575;background:#f1dfba;box-shadow:0 3px 0 #c7a16c;font-size:19px;font-weight:800;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink-dark)}
.level-tile.current{background:#f8ce73;border-color:#a77936;box-shadow:0 3px 0 #a77936}
.level-tile.cleared{background:#d8e5ba;border-color:#8ba36f;box-shadow:0 3px 0 #a1b282}
.level-tile.cleared:after{content:"";width:6px;height:3px;border-left:2px solid #618052;border-bottom:2px solid #618052;transform:rotate(-45deg);position:absolute;bottom:6px;right:6px}
.level-tile:disabled{background:#eee9dd;border-color:#d9d1c3;box-shadow:0 3px 0 #d6cebf;color:#b9ab96}
.legend{font-size:11px;color:#8a7155;text-align:center;line-height:1.8;margin:0}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e8dcc7;font-size:13px}
.toggle-row>span>small{display:block;color:#a18c70;font-size:10px;margin-top:4px}
.switch{width:43px;height:25px;flex-shrink:0;border-radius:20px;background:#d4c7b1;padding:3px;box-shadow:inset 0 1px 2px #6e512622;position:relative}
.switch:after{content:"";display:block;width:19px;height:19px;border-radius:50%;background:#fffdf4;box-shadow:0 1px 2px #6e512622;transition:transform .15s}
.switch[aria-checked="true"]{background:#7da980}
.switch[aria-checked="true"]:after{transform:translateX(18px)}
.small-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.small-links>button{font-size:12px;min-height:38px;padding:5px 10px;background:#fff8e9;border:1px solid #ddc9a8;border-radius:9px;color:#846649}
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);background:#f3ead8;border:1px solid #e5d4b5;border-radius:13px;padding:14px 4px;margin:19px 0}
.stats-strip .stat{text-align:center}
.stats-strip strong{display:block;font-size:21px;color:#4e6b52}
.stats-strip small{font-size:10px;color:#8a7155}
.reward-line{font-size:13px;text-align:center;background:#fff6dd;border:1px dashed #cfa763;border-radius:10px;padding:8px;color:#8a653a;font-weight:700}
.loss-progress{margin:0 0 12px;text-align:center;font-size:14px;font-weight:800;color:#4e7355}
.lost-tray{display:flex;gap:14px;justify-content:center;padding:16px 0 5px}
.lost-tray span,.lost-tray button{width:42px;height:42px;border-radius:50%;background:var(--dot);border:2px solid #725044;box-shadow:inset 0 2px 0 #ffffff70,0 3px 0 #725044;color:#fff;font-weight:800;display:grid;place-items:center;text-shadow:0 1px 2px #4b3929;padding:0}
.lost-tray span:last-child,.lost-tray button:last-child{outline:3px solid #9d3925;outline-offset:3px}
.lost-tray button{cursor:pointer}
.lost-tray button.picked{outline:3px solid #2f7d54 !important;outline-offset:3px;transform:translateY(2px)}
.hopeless-note{margin:14px 0 6px;padding:11px 14px;border-radius:12px;background:#f7ece2;border:1px solid #ddbfa4;color:#8a4a2c;font-size:13px;line-height:1.55;text-align:center}
.unlock-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 4px}
.unlock-chip{font-size:11px;padding:4px 9px;border-radius:20px;background:#eee9dd;color:#b9ab96}
.unlock-chip.owned{background:#d8e5ba;color:#4e6b52;font-weight:700}
.room-progress{height:9px;background:#e3d9c2;border-radius:8px;overflow:hidden;margin:12px 0 4px}
.room-progress>span{display:block;height:100%;background:#7dbb89;border-radius:8px}
.room-caption{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#59734d}
/* 排行榜 */
.brand-tools{display:flex;align-items:center;gap:7px}
.rank-button{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 6px;border-radius:13px;border:1.5px solid #a06f22;background:linear-gradient(#ffeeb5,#ffd06d);box-shadow:0 2px 0 #a06f22,inset 0 1px 0 #fffceb;color:#6b4510;font-size:10.5px;font-weight:900;letter-spacing:1px;line-height:1;animation:rankPulse 2.8s ease-in-out infinite;transform-origin:center}
.rank-button .icon{width:16px;height:16px;fill:#f7a52a;stroke:#6f4410;stroke-width:1.9}
.rank-button:active{transform:translateY(1px);box-shadow:0 1px 0 #a06f22,inset 0 1px 0 #fffceb}
.rank-button:hover{filter:brightness(1.04)}
.rank-button-text{white-space:nowrap}
@keyframes rankPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){.rank-button{animation:none}}
.help-button .icon{width:21px;height:21px}
.rank-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#efe2c8;padding:5px;border-radius:12px;margin:14px 0 12px}
.rank-tab{min-height:35px;border-radius:9px;font-size:12.5px;font-weight:700;letter-spacing:1px;color:#8a7155;background:transparent}
.rank-tab.on{background:#fffaf0;color:#3c2d24;box-shadow:0 2px 0 #d9c7a4}
.rank-hero{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f1f7e3;border:1px solid #cfe0b4;border-radius:13px;padding:11px 13px;margin-bottom:10px}
.rank-hero strong{font-size:17px;letter-spacing:1px}
.rank-hero small{display:block;font-size:10.5px;line-height:1.6;color:#6d8557;margin-top:3px}
.rank-hero button{flex-shrink:0;font-size:11px;padding:7px 10px;border-radius:8px;background:#fffaf0;border:1px solid #cfbb98;color:#846649}
.rank-list{display:flex;flex-direction:column;gap:3px;max-height:40svh;overflow:auto;-webkit-overflow-scrolling:touch}
.rank-row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;background:#faf5e8}
.rank-row:nth-child(even){background:#f5eddc}
.rank-row.me{background:#e8f2d5;box-shadow:inset 0 0 0 1.5px #a8c186}
.rank-no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:#e6dcc6;color:#8a7155}
.rank-no.t1{background:#f6c36e;color:#6c4d25;box-shadow:inset 0 -2px 0 #d59f45}
.rank-no.t2{background:#dbd8cd;color:#6a6558;box-shadow:inset 0 -2px 0 #b8b3a3}
.rank-no.t3{background:#e0ab74;color:#6f4520;box-shadow:inset 0 -2px 0 #bd8450}
.rank-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.rank-nick{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-nick em{font-style:normal;font-size:9px;padding:1px 5px;border-radius:6px;background:#7dbb89;color:#fff;font-weight:700;flex-shrink:0}
.rank-sub{font-size:10px;color:#9a8668;font-weight:500}
.rank-val{font-size:13.5px;font-weight:800;color:#4e6b52;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rank-val small{font-size:9.5px;font-weight:600;color:#8a9a7c;margin-left:2px}
.rank-gap{text-align:center;font-size:11px;color:#b1a184;letter-spacing:3px;padding:2px 0}
.rank-empty{text-align:center;font-size:12px;color:#8a7155;padding:22px 10px;line-height:1.9;background:#f7f1e2;border-radius:11px}
.rank-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:#9a8668;margin-top:9px}
.region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-height:46svh;overflow:auto;margin:12px 0 4px}
.region-grid button{min-height:38px;border-radius:9px;background:#f6efdd;border:1px solid #e0d0b1;font-size:12px;color:#5f4a35}
.region-grid button.on{background:#d8e5ba;border-color:#8ba36f;font-weight:800;color:#3f5c34}
.rank-callout{width:100%;margin-top:12px;padding:11px;border-radius:11px;border:1px dashed #cfa763;background:#fff6dd;color:#8a653a;font-size:12.5px;font-weight:700;letter-spacing:.5px}
/* 道具商店 & 模拟支付 */
.shop-item{display:flex;align-items:center;gap:12px;background:#f7f1e2;border:1px solid #e5d4b5;border-radius:13px;padding:12px;margin-bottom:10px}
.shop-face{flex-shrink:0;width:46px;height:46px;border-radius:13px;border:2px solid #7e653e;display:grid;place-items:center;box-shadow:inset 0 2px 0 #fff6,0 2px 0 #b18c4e}
.shop-face .icon{width:25px;height:25px;stroke-width:2.1}
.shop-info{flex:1;min-width:0}
.shop-info strong{display:block;font-size:14px;letter-spacing:1px}
.shop-info small{display:block;font-size:11px;line-height:1.6;color:#90765a;margin-top:3px}
.shop-own{font-size:10.5px;color:#8a7155;margin-top:4px;display:block}
.ad-stage{display:grid;place-items:center;padding:12px 0 2px}
.ad-mascot{font-size:40px;animation:adBob 1s ease-in-out infinite alternate}
@keyframes adBob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.ad-progress{width:100%;max-width:260px;height:10px;border-radius:6px;background:#eee2c8;border:1px solid #c9b891}

function boardPoly(board, pose) {

        ctx.ellipse(kx, ky, 8 + k * 5, 1.3 + k * 1.35, 0, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 4) 描边（提示 / 遮挡有不同强调色）
    const isHintBoard = o.hintBoard && o.hintBoard === board.id;
    const isBlocked = o.blockedBoard === board.id;
    polygon(ctx, pts);
    ctx.lineWidth = isBlocked ? 5 : isHintBoard ? 3.5 : 2.3;
    ctx.strokeStyle = isBlocked ? '#a63e2b' : isHintBoard ? '#d49825' : '#805a3f';
    ctx.stroke();

    // 5) 内侧亮线
    ctx.save();
    polygon(ctx, pts);
    ctx.clip();
    polygon(ctx, pts, 1.3);
    ctx.strokeStyle = 'rgba(255,251,226,.62)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // 6) 螺丝孔（已被拆走的钉 + 掉落中的板）
    const screws = state.screws.filter((s) => s.board === board.id);
    const falling = board.status === 'falling' || board.status === 'gone';
    for (let i = 0; i < screws.length; i++) {
      const s = screws[i];
      if (s.place === 'board' && !falling) continue;
      r.drawHole(ctx, s.localX, s.localY);
    }

    // 7) 螺丝头（板掉落中不画头）
    if (!falling) {
      for (let i = 0; i < screws.length; i++) {
        const s = screws[i];
        if (s.place !== 'board') continue;
        const exposed = hookExposed(state, s);
        // 提示单颗 / 透视全亮：高亮所有当前可拆的螺丝
        const hint = exposed && ((o.hintScrew && o.hintScrew === s.id) || o.peek);
        if (hint) {
          const pulse = 0.75 + 0.25 * Math.sin(nowMs / 165);
          circle(ctx, s.localX, s.localY, HEAD + 5 + pulse * 2);
          ctx.fillStyle = 'rgba(255,242,126,.34)';
          ctx.fill();
          ctx.strokeStyle = '#fff9bd';
          ctx.lineWidth = 2.4;
          ctx.stroke();
        }
        r.drawScrew(ctx, s.localX, s.localY, s.color, {
          radius: HEAD,
          exposed: exposed,
          rotation: -angle
        });
      }
    }

    ctx.restore();
  };

  r.drawHole = function (ctx, x, y) {
    circle(ctx, x, y + 0.8, 6.7);
    ctx.fillStyle = '#9c7657';
    ctx.fill();
    circle(ctx, x, y, 5.7);
    ctx.fillStyle = '#be9b73';
    ctx.fill();
    ctx.strokeStyle = '#704e37';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y + 0.9, 4.6, 0.14, Math.PI - 0.1);
    ctx.strokeStyle = '#f5d8ad';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  };

  r.drawScrew = function (ctx, x, y, colorId, o) {
    o = o || {};
    const color = colorOf(colorId);
    const rr = o.radius || HEAD;
    const scale = o.hover ? 1.055 : 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    if (o.rotation) ctx.rotate(o.rotation);

    // 下沉暗底（厚度感）
    ctx.shadowColor = 'rgba(70,43,22,.22)';
    ctx.shadowBlur = 2;
    ctx.shadowOffsetY = 2;
    circle(ctx, 0, 2.1, rr);
    ctx.fillStyle = color.dark;
    ctx.fill();
    ctx.shadowColor = 'transparent';

    // 球面渐变
    const grad = ctx.createRadialGradient(-rr * 0.4, -rr * 0.48, 0.3, 0, 0, rr * 1.28);
    grad.addColorStop(0, color.light);
    grad.addColorStop(0.48, color.fill);
    grad.addColorStop(1, color.fill);
    circle(ctx, 0, 0, rr);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = color.dark;
    ctx.stroke();

    // 高光弧
    ctx.beginPath();
    ctx.arc(0, 0.3, rr - 2.2, Math.PI * 1.05, Math.PI * 1.6);
    ctx.strokeStyle = 'rgba(255,255,255,.62)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 颜色符号
    text(ctx, color.symbol || '＋', 0, 0.5, rr * 1.25, color.dark, 900);

    // 露出发亮圈 / 被遮挡压暗
    if (o.exposed === true) {
      circle(ctx, 0, 0, rr + 1);
      ctx.strokeStyle = '#fff9df';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else if (o.exposed === false) {
      circle(ctx, 0, 0, rr - 1);
      ctx.fillStyle = 'rgba(58,48,36,.22)';
      ctx.fill();
    }
    if (o.hover) {
      circle(ctx, 0, 0, rr + 1.6);
      ctx.strokeStyle = '#fffbe3';
      ctx.lineWidth = 1.9;
      ctx.stroke();
    }
    ctx.restore();
  };

  /* ------------------------- 场景 ------------------------- */

  r.drawBackground = function (state, o) {
    const ctx = r.ctx;
    const sky = ctx.createLinearGradient(0, 0, 0, 540);
    sky.addColorStop(0, '#8edcee');
    sky.addColorStop(0.6, '#c3eced');
    sky.addColorStop(1, '#e3f4df');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    cloud(ctx, 38, 53, 0.75);
    cloud(ctx, 411, 115, 1.0);
    cloud(ctx, 71, 294, 0.55);

    // 木屋框：内衬 + 内墙 + 双立柱 + 上下横梁
    const x = HOUSE.left;
    const y = HOUSE.top;
    const w = HOUSE.width;
    const h = HOUSE.height;

    ctx.fillStyle = '#fae4b0';
    rounded(ctx, x + 9, y + 9, w - 18, h - 18, 14);
    ctx.fill();
    ctx.fillStyle = '#bde2d4';
    rounded(ctx, x + 18, y + 19, w - 36, h - 36, 8);
    ctx.fill();

    const cabin = ctx.createLinearGradient(x, 0, x + w, 0);
    cabin.addColorStop(0, '#b67c45');
    cabin.addColorStop(0.45, '#deb174');
    cabin.addColorStop(1, '#a56b3d');
    ctx.fillStyle = cabin;
    [x, x + w - 13].forEach(function (xx) {
      rounded(ctx, xx, y, 13, h, 4);
      ctx.fill();
      ctx.strokeStyle = '#785332';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    [y, y + h - 16].forEach(function (yy) {
      rounded(ctx, x - 8, yy, w + 16, 19, 5);
      ctx.fillStyle = '#e8b469';
      ctx.fill();
      ctx.strokeStyle = '#8d613b';
      ctx.lineWidth = 2;
      ctx.stroke();
      line(ctx, x - 1, yy + 4, x + w + 1, yy + 4, '#ffe4a1', 3);
    });

    r.drawMascot(ctx, 161, 207, 158, 171, state.status === 'won', o);

    // 全部拆空后的提示
    let alive = 0;
    for (let i = 0; i < state.boards.length; i++) if (state.boards[i].status !== 'gone') alive++;
    if (alive === 0) text(ctx, '机关修好了！', 240, 127, 24, '#704c32', 800);
  };

  r.drawMascot = function (ctx, x, y, w, h, happy, o) {
    const img = r.images.mascot;
    const bob = happy && !o.reduced ? Math.sin((o.now || now()) / 190) * 3 : 0;
    if (img && img.width) {
      const scale = Math.min(w / img.width, h / img.height);
      ctx.drawImage(img, x + (w - img.width * scale) / 2, y + (h - img.height * scale) / 2 + bob, img.width * scale, img.height * scale);
      return;
    }
    // 无图时的降级：软垫 + 文案
    const pillow = ctx.createLinearGradient(0, y + h - 40, 0, y + h);
    pillow.addColorStop(0, '#f0c58c');
    pillow.addColorStop(1, '#cd965b');
    ctx.fillStyle = pillow;
    rounded(ctx, x + 10, y + h - 40, w - 20, 32, 15);
    ctx.fill();
    ctx.strokeStyle = '#9c713e';
    ctx.lineWidth = 2;
    ctx.stroke();
    text(ctx, happy ? '欢迎回家' : '等你来解救', x + w / 2, y + h - 22, 13, '#755134');
  };

  r.drawFunnel = function (state) {
    const ctx = r.ctx;
    const count = state.tray.length;
    const danger = count === 3 && state.status === 'playing';
    const top = count ? state.screws.find((s) => s.id === state.tray[count - 1]) : null;

    rounded(ctx, FUNNEL.x, FUNNEL.y, FUNNEL.w, FUNNEL.h, FUNNEL.r);
    ctx.fillStyle = '#f6d59b';
    ctx.fill();
    ctx.strokeStyle = danger || state.status === 'lost' ? '#b44b35' : '#a67945';
    ctx.lineWidth = danger ? 3 : 2;
    ctx.stroke();

    for (let i = 0; i < SLOT.count; i++) {
      const p = slotAt(i);
      rounded(ctx, p.x - 30, p.y - 24, 60, 48, 11);
      ctx.fillStyle = '#fff4d8';
      ctx.fill();
      ctx.strokeStyle = (i === count - 1 && count) || (danger && i === 3) ? '#a64f30' : '#be9761';
      ctx.lineWidth = i === count - 1 ? 2.6 : 1.5;
      ctx.stroke();
      if (danger && i === 3) {
        const color = colorOf(top.color);
        ctx.save();
        ctx.setLineDash([4, 3]);
        ctx.strokeStyle = color.dark;
        ctx.lineWidth = 2;
        circle(ctx, p.x, p.y, 20);
        ctx.stroke();
        ctx.restore();
        text(ctx, color.symbol, p.x, p.y, 24, color.dark, 900);
      } else if (i >= count) {
        text(ctx, String(i + 1), p.x, p.y, 17, '#b5a082', 700);
      }
      if (i < 3) text(ctx, '›', p.x + 44, p.y, 18, '#a78452', 700);
    }
  };

  r.drawTray = function (state, o) {
    o = o || {};
    const ctx = r.ctx;
    for (let i = 0; i < state.tray.length; i++) {
      const screw = state.screws.find((s) => s.id === state.tray[i]);
      if (!screw) continue;
      const p = slotAt(i);
      r.drawScrew(ctx, p.x, p.y, screw.color, { radius: 19 });
      // 移出道具选择态：可点槽位呼吸圈，已选中的实心描边
      if (o.sweepPick) {
        const picked = o.sweepPick.indexOf(screw.id) !== -1;
        const pulse = 0.75 + 0.25 * Math.sin((o.now || now()) / 165);
        ctx.beginPath();
        ctx.arc(p.x, p.y, picked ? 24 : 22 + pulse * 2, 0, TAU);
        ctx.strokeStyle = picked ? '#2f7d54' : '#ffffff';
        ctx.lineWidth = picked ? 3.4 : 2.2;
        ctx.stroke();
      }
    }
  };

  /** 槽位命中测试：画布坐标 -> 暂存槽里的螺丝 id（移出道具选择用）
   *  注意：托盘绘制在渲染空间（板区变换 restore 之后），不能用 toStage（那是板区 stage 坐标） */
  r.trayHitTest = function (state, px, py) {
    if (!state || !state.tray.length) return null;
    const x = (px - r.ox) / r.scale;
    const y = (py - r.oy) / r.scale;
    for (let i = state.tray.length - 1; i >= 0; i--) {
      const s = slotAt(i);
      if (Math.hypot(x - s.x, y - s.y) <= 26) return state.tray[i];
    }
    return null;
  };

  /**
   * 「移出」配件区：棋盘外的 2 个悬停位。
   * 取出的螺丝停在这里，不受任何木板遮挡，随时可以点回暂存槽。
   */
  r.drawSpare = function (state, o) {
    o = o || {};
    const ctx = r.ctx;
    const n = state && state.spare ? state.spare.length : 0;
    if (!n) return;
    const t = o.now || now();
    for (let i = 0; i < SPARE.count; i++) {
      const p = spareAt(i);
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, SPARE.r + 5, 0, TAU);
      ctx.strokeStyle = i < n ? 'rgba(166,121,69,0.62)' : 'rgba(166,121,69,0.28)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.restore();

      if (i >= n) continue;
      const screw = state.screws.find((s) => s.id === state.spare[i]);
      if (!screw) continue;
      r.drawScrew(ctx, p.x, p.y, screw.color, { radius: 19 });
      // 可点呼吸圈：告诉玩家这枚可以取回托盘
      if (state.status === 'playing') {
        const pulse = 0.5 + 0.5 * Math.sin(t / 380 + i);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 24 + pulse * 3, 0, TAU);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.28 + 0.4 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }
    }
    text(ctx, '配件区', SPARE.x0 + SPARE.gap / 2, SPARE.y - SPARE.r - 16, 11, '#8a6b47', 700);
  };

  /** 配件区命中测试（与托盘同属渲染空间） */
  r.spareHitTest = function (state, px, py) {
    if (!state || !state.spare || !state.spare.length) return null;
    const x = (px - r.ox) / r.scale;
    const y = (py - r.oy) / r.scale;
    for (let i = state.spare.length - 1; i >= 0; i--) {
      const s = spareAt(i);
      if (Math.hypot(x - s.x, y - s.y) <= SPARE.r + 8) return state.spare[i];
    }
    return null;
  };

  /** 槽内同色消除：两球合拢 → 碰撞爆裂（扩散环 + 粒子 + 闪光） */
  r.drawMatches = function () {
    const ctx = r.ctx;
    if (!r.matches) r.matches = [];
    for (let i = 0; i < r.matches.length; i++) {
      const m = r.matches[i];
      const t = m.age / m.dur;
      const color = colorOf(m.color);
      const cx = (m.x1 + m.x2) / 2;
      const cy = (m.y1 + m.y2) / 2;
      ctx.save();
      if (t < 0.45) {
        // 相位一：两枚小球向中点滑动并微微放大
        const k = Math.pow(t / 0.45, 2);
        const arc = 7 * Math.sin(k * Math.PI);
        const s = 1 + 0.18 * k;
        const x1 = m.x1 + (cx - m.x1) * k;
        const y1 = m.y1 + (cy - m.y1) * k - arc;
        const x2 = m.x2 + (cx - m.x2) * k;
        const y2 = m.y2 + (cy - m.y2) * k - arc;
        r.drawScrew(ctx, x1, y1, m.color, { radius: 19 * s });
        r.drawScrew(ctx, x2, y2, m.color, { radius: 19 * s });
      } else {
        // 相位二：爆裂
        const k = (t - 0.45) / 0.55;
        const fade = 1 - k;
        ctx.globalAlpha = Math.min(1, fade * 1.35);
        // 中心白闪
        ctx.fillStyle = '#fffdf0';
        circle(ctx, cx, cy, 15 * (1 - k) + 3);
        ctx.fill();
        // 双层扩散环（外圈深色描边增强对比）
        ctx.strokeStyle = color.dark;
        ctx.lineWidth = 1.2;
        circle(ctx, cx, cy, 15 + 38 * k);
        ctx.stroke();
        ctx.strokeStyle = color.fill;
        ctx.lineWidth = 4 * fade + 0.6;
        circle(ctx, cx, cy, 13 + 34 * k);
        ctx.stroke();
        ctx.strokeStyle = color.light;
        ctx.lineWidth = 2.4 * fade + 0.4;
        circle(ctx, cx, cy, 8 + 24 * k);
        ctx.stroke();
        // 八向粒子（带一点上抛）
        for (let p = 0; p < 8; p++) {
          const ang = (p / 8) * TAU + 0.4;
          const dist = 15 + 34 * k;
          const px = cx + Math.cos(ang) * dist;
          const py = cy + Math.sin(ang) * dist - 10 * k * k;
          ctx.fillStyle = p % 2 ? color.light : color.fill;
          circle(ctx, px, py, 4 * fade + 0.8);
          ctx.fill();
        }
      }
      ctx.restore();
    }
  };

  r.drawWinSparkles = function (o) {
    const ctx = r.ctx;
    const t0 = o.now || now();
    for (let i = 0; i < 12; i++) {
      const t = o.reduced ? 0.5 : (t0 / 1800 + i * 0.173) % 1;
      const x = 75 + ((i * 113) % 330);
      const y = 80 + t * 340;
      ctx.save();
      ctx.globalAlpha = Math.sin(t * Math.PI) * 0.8;
      star(ctx, x, y, 3 + (i % 3), i + t * 3);
      ctx.fillStyle = i % 2 ? '#fffbd6' : '#f2bc50';
      ctx.fill();
      ctx.restore();
    }
  };

  /* ------------------------- 主绘制 ------------------------- */

  r.draw = function (state, o) {
    o = o || {};
    const ctx = r.ctx;
    const t = o.now || now();
    if (!state) return;

    ctx.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
    ctx.clearRect(0, 0, r.width, r.height);
    ctx.save();
    ctx.translate(r.ox, r.oy);
    ctx.scale(r.scale, r.scale);

    // 底板底色（漏斗区可见）
    ctx.fillStyle = '#c3eced';
    ctx.fillRect(0, 0, W, H);

    // 板区：裁剪 + 变换
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, STAGE_CLIP);
    ctx.clip();
    ctx.translate(BOARD_X, BOARD_Y);
    ctx.scale(BOARD_SCALE, BOARD_SCALE);

    r.drawBackground(state, { now: t, reduced: o.reduced });

    // 木板按 layer 升序（后画的在上）
    const ordered = state.boards.slice().sort((a, b) => (a.layer || 0) - (b.layer || 0));
    for (let i = 0; i < ordered.length; i++) {
      const b = ordered[i];
      if (b.status === 'gone') {
        // 已回收：若刚掉出画面则不再画
        let drawing = false;
        for (let k = 0; k < r.falling.length; k++) if (r.falling[k].id === b.id) drawing = true;
        if (!drawing) continue;
      }
      let pose = null;
      if (b.status === 'hinged') {
        const sw = r.swings[b.id];
        pose = sw && !sw.done ? { x: sw.x, y: sw.y, angle: sw.angle } : { x: b.x, y: b.y, angle: b.angle };
      } else if (b.status === 'gone' || b.status === 'falling') {
        for (let k = 0; k < r.falling.length; k++) {
          if (r.falling[k].id === b.id) pose = r.falling[k];
        }
        if (!pose) continue;
      } else {
        pose = { x: b.x, y: b.y, angle: b.angle };
      }
      const view = {
        id: b.id,
        points: b.points,
        x: pose.x,
        y: pose.y,
        angle: pose.angle,
        status: b.status === 'gone' || b.status === 'falling' ? 'falling' : b.status
      };
      ctx.save();
      ctx.globalAlpha = pose.alpha === undefined ? 1 : pose.alpha;
      r.drawBoard(view, state, {
        now: t,
        hintBoard: o.hintBoard,
        hintScrew: o.hintScrew,
        blockedBoard: o.blockedBoard,
        peek: o.peek,
        reduced: o.reduced
      });
      ctx.restore();
    }

    ctx.restore(); // 板区

    r.drawFunnel(state);
    r.drawSpare(state, { now: t });
    r.drawTray(state, { sweepPick: o.sweepPick, now: t });
    r.drawMatches();
    if (state.status === 'won') r.drawWinSparkles({ now: t, reduced: o.reduced });

    ctx.restore();
    ctx.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
  };

  /** 命中测试：画布坐标 -> 已露出的螺丝 id */
  r.hitTest = function (state, px, py) {
    if (!state || state.status !== 'playing') return null;
    const p = r.toStage(px, py);
    if (p.x < 0 || p.x > W || p.y < 0 || p.y >= STAGE_CLIP) return null;
    const reach = 16 + 2;
    let best = null;
    let bestLayer = -1;
    for (let i = 0; i < state.screws.length; i++) {
      const s = state.screws[i];
      if (s.place !== 'board') continue;
      const b = state.boards.find((x) => x.id === s.board);
      if (!b) continue;
      const pos = coreScrewPos(state, s, r.poseProvider);
      if (Math.hypot(pos.x - p.x, pos.y - p.y) > reach) continue;
      if (!hookExposed(state, s)) continue;
      if (b.layer > bestLayer) {
        bestLayer = b.layer;
        best = s.id;
      }
    }
    return best;
  };

  return r;
}

/** 螺丝世界坐标（避免 renderer 依赖 core：公式与 core.screwPos 一致） */
function coreScrewPos(state, screw, poseProvider) {
  if (screw.place !== 'board') return { x: screw.anchorX, y: screw.anchorY };
  const b = state.boards.find((x) => x.id === screw.board);
  if (!b) return { x: 0, y: 0 };
  const pose = poseProvider ? poseProvider(state, b) : null;
  const a = pose ? pose.angle : b.angle;
  const px = pose ? pose.x : b.x;
  const py = pose ? pose.y : b.y;
  const c = Math.cos(a);
  const s = Math.sin(a);
  return { x: px + screw.localX * c - screw.localY * s, y: py + screw.localX * s + screw.localY * c };
}

function configure(colors, isExposedFn) {
  COLORS = colors || [];
  hookExposed = isExposedFn || function () { return true; };
}

module.exports = { createRenderer, configure, coreScrewPos, HEAD, BOARD_SCALE, BOARD_X, BOARD_Y };

});
</script>

  /* ------------------------------ 存档 ------------------------------ */
  let profile = loadProfile();
  function loadProfile() {
    const d = { unlocked: 1, cleared: [], settings: { sound: true, reducedMotion: false, autoHint: true }, best: {}, items: { sweep: 1, peek: 1 } };
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        d.unlocked = Math.min(20, Math.max(1, p.unlocked || 1));
        d.cleared = (p.cleared || []).filter((n) => n >= 1 && n <= 20);
        if (p.settings) Object.assign(d.settings, p.settings);
        if (p.best) d.best = p.best;
        // 道具库存：老档没有则赠 1 移出 + 1 透视做新手礼
        if (p.items && typeof p.items === 'object') {
          d.items.sweep = Math.max(0, Number(p.items.sweep) || 0);
          d.items.peek = Math.max(0, Number(p.items.peek) || 0);
        }
        // 广告领取记录与每日福利日期
        if (p.ad && typeof p.ad === 'object') d.ad = p.ad;
        if (p.share && typeof p.share === 'object') d.share = p.share;
        if (p.lastGiftDate) d.lastGiftDate = p.lastGiftDate;
      }
    } catch (e) { /* ignore */ }
    return d;
  }
  function saveProfile() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(profile)); } catch (e) { /* ignore */ }
  }
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  /** 每日福利：每天首次打开送移出+1 透视+1，提高回访粘性 */
  function checkDailyGift() {
    if (profile.lastGiftDate === todayKey()) return false;
    profile.lastGiftDate = todayKey();
    profile.items.sweep += 1;
    profile.items.peek += 1;
    saveProfile();
    return true;
  }
  /** 激励视频每日免费名额（原型 3 次/天） */
  function adLeft() {
    const used = profile.ad && profile.ad.date === todayKey() ? profile.ad.count : 0;
    return Math.max(0, 3 - used);
  }
  /** 分享得道具每日配额（3 次/天，和广告独立计次） */
  const SHARE_DAILY = 3;
  function shareLeft() {
    const used = profile.share && profile.share.date === todayKey() ? profile.share.count : 0;
    return Math.max(0, SHARE_DAILY - used);
  }

  /* ------------------------------ 游戏状态 ------------------------------ */

  let paused = false;
  let ended = false;
  let lastWinReward = '';
  let lastFrame = 0;
  let hintStage = 0; // 0 无 / 1 看板 / 2 看螺丝
  let hintBoardId = null;
  let hintScrewId = null;
  let idleSince = 0;
  // 道具运行态：移出选择模式 / 透视截止时间 / 复活点选
  let sweepMode = false;
  let sweepSel = [];
  let peekUntil = 0;
  let reviveSel = [];
  // 失败局面「还有没有救」的判定缓存（key 由关卡+步数+槽内容组成）
  let rescueCache = null;
  let rescuePending = false;

  function startLevel(n) {
    const level = getLevel(n) || getLevel(1);
    state = core.createState(level);
    elapsed = 0;
    paused = false;
    ended = false;
    hintStage = 0;
    hintBoardId = hintScrewId = null;
    sweepMode = false;
    sweepSel = [];
    peekUntil = 0;
    reviveSel = [];
    rescueCache = null;
    lastWinReward = '';
    renderer.reset();
    closeDialog();
    $('levelLabel').textContent = '第 ' + level.id + ' 关';
    $('levelName').textContent = level.name;
    $('goalLine').textContent = '本关添置「' + FURNISHINGS[level.id - 1] + '」 · 为小橘猫修好小屋';
    $('boardHint').textContent = level.focus || '相邻两枚同色才消除';
    $('boardHint').classList.remove('hidden');
    updateUI();
  }

  function updateUI() {
    const pct = Math.round((state.matched / state.total) * 100);
    $('progressFill').style.width = pct + '%';
    $('progressPct').textContent = pct + '%';
    $('progressText').textContent = '已消除 ' + state.matched + ' / ' + state.total + ' 枚 · ' + pct + '%';
    const trayEl = $('trayStatus');
    trayEl.textContent = '暂存 ' + state.tray.length + ' / 4 · 从左往右放';
    trayEl.classList.toggle('danger', state.tray.length >= 3 && state.status === 'playing');
    $('btnUndo').disabled = !core.canUndo(state);
    const uLeft = core.undoLeft(state);
    $('undoLabel').textContent = uLeft <= 0 ? '本关已用完' : '剩 ' + uLeft + ' 次';
    $('roomCount').textContent = profile.cleared.length + ' / 20';
    if (state.moves > 0) $('boardHint').classList.add('hidden');
    // 道具箱徽章（移出+透视总数）
    const itTotal = profile.items.sweep + profile.items.peek;
    $('itemsBadge').textContent = itTotal;
    $('itemsBadge').classList.toggle('zero', itTotal <= 0);
    $('itemsLabel').textContent = itTotal > 0 ? '剩 ' + itTotal + ' 个' : '免费领道具';
  }

  function clock(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  /* ------------------------------ 主循环 ------------------------------ */
  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0);
    lastFrame = now;
    // 结算（won/lost）后仍推进特效动画，只冻结计时与自动提示；
    // 否则最后一对消除的动画 age 永远停在 0，看起来「没有消除动画」
    if (state && !paused) {
      renderer.step(dt);
      if (state.status === 'playing' && !ended) {
        elapsed += dt * 1000;
        // 30 秒无操作自动提示
        if (state.moves > 0 && profile.settings.autoHint && now - idleSince > 30000 && hintStage === 0) {
          doHint(true);
        }
      }
    }
    if (state) {
      renderer.draw(state, {
        hintBoard: hintStage === 1 ? hintBoardId : null,
        hintScrew: hintStage === 2 ? hintScrewId : null,
        peek: !paused && performance.now() < peekUntil,
        sweepPick: sweepMode ? sweepSel : null
      });
      $('timer').textContent = clock(elapsed);
    }
    requestAnimationFrame(frame);
  }

  /* ------------------------------ 交互 ------------------------------ */
  canvas.addEventListener('pointerdown', function (e) {
    if (!state || ended || paused) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    // 移出道具选择模式：点暂存槽里的螺丝，选满两枚自动生效
    if (sweepMode) {
      const trayId = renderer.trayHitTest(state, x, y);
      if (!trayId) return;
      const at = sweepSel.indexOf(trayId);
      if (at !== -1) sweepSel.splice(at, 1);
      else if (sweepSel.length < 2) sweepSel.push(trayId);
      if (sweepSel.length === 2) executeSweep(sweepSel.slice());
      return;
    }
    // 配件区：点一下把这枚螺丝取回暂存槽（不受棋盘遮挡，随时可用）
    const spareId = renderer.spareHitTest(state, x, y);
    if (spareId) {
      const rs = core.takeSpare(state, spareId);
      if (!rs.ok) {
        if (rs.reason === 'tray-full') toast('暂存槽满了，先消掉两枚再来取');
        return;
      }
      idleSince = performance.now();
      clearHint();
      renderer.sync(state, rs.events);
      updateUI();
      if (state.status === 'won') onWin();
      else if (state.status === 'lost') onLose();
      return;
    }
    const id = renderer.hitTest(state, x, y);
    if (!id) return;
    idleSince = performance.now();
    clearHint();
    const res = core.tap(state, id, renderer.poseProvider);
    if (!res.ok) {
      if (res.reason === 'blocked') toast('这枚被木板挡住了，先拆上面或等木板摆开');
      return;
    }
    renderer.sync(state, res.events);
    if (res.events.some((ev) => ev.type === 'match')) hideHintSoon();
    updateUI();
    if (state.status === 'won') onWin();
    else if (state.status === 'lost') onLose();
  });

  /* ------------------------------ 道具 ------------------------------ */
  function cancelSweep() {
    sweepMode = false;
    sweepSel = [];
    if (state && state.status === 'playing' && !dialog.open) showInline('');
  }

  function beginSweep() {
    if (!state || ended || paused) return;
    if (state.status !== 'playing') return;
    if (profile.items.sweep <= 0) { showShop('sweep'); return; }
    if (state.tray.length < 2) { toast('暂存槽不足两枚，先用不上移出'); return; }
    if (state.spare.length >= 2) { toast('配件区已满，先把里面两枚放回暂存槽'); return; }
    sweepMode = true;
    sweepSel = [];
    clearHint();
    showInline('点选暂存槽里要移出的螺丝，它们会停到棋盘外的配件区，随时能取回来');
  }

  function executeSweep(ids) {
    const res = core.sweep(state, ids);
    if (!res.ok) { cancelSweep(); toast('移出失败，稍后再试'); return; }
    profile.items.sweep -= 1;
    saveProfile();
    sweepMode = false;
    sweepSel = [];
    renderer.reset();
    // 移出后原本被隔开的同色会重新相邻而消除，这条动画不能丢
    renderer.sync(state, res.events);
    for (const b of state.boards) {
      if (b.status === 'hinged') renderer.poses[b.id] = { x: b.x, y: b.y, angle: b.angle };
    }
    clearHint();
    updateUI();
    toast('已移出 ' + res.moved + ' 枚到配件区，可随时取回或撤回');
  }

  function usePeek() {
    if (!state || ended || paused) return;
    if (state.status !== 'playing') return;
    if (profile.items.peek <= 0) { showShop('peek'); return; }
    profile.items.peek -= 1;
    saveProfile();
    peekUntil = performance.now() + 5000;
    clearHint();
    updateUI();
    showInline('透视中：高亮的螺丝当前都能拆，5 秒后消失');
  }

  function hideHintSoon() {
    // boardHint 由 updateUI 的 moves>0 隐藏，这里处理 inline status
  }

  $('btnUndo').addEventListener('click', () => {
    if (!state || ended) return;
    const res = core.undo(state);
    if (!res.ok) {
      if (res.reason === 'limit') toast('本关撤回次数已用完（' + core.UNDO_LIMIT + ' 次），可重开本关');
      return;
    }
    renderer.reset();
    // 恢复铰摆板到落定位
    for (const b of state.boards) {
      if (b.status === 'hinged') renderer.poses[b.id] = { x: b.x, y: b.y, angle: b.angle };
    }
    clearHint();
    updateUI();
    if (state.undos === state.undoLimit) toast('本关撤回次数已用完，再点错只能重开');
  });

  $('btnHint').addEventListener('click', () => doHint(false));
  $('btnItems').addEventListener('click', () => showShop());
  $('btnMenu').addEventListener('click', () => showPause());
  $('btnLevels').addEventListener('click', showLevels);
  $('btnPause').addEventListener('click', showPause);
  $('btnHelp').addEventListener('click', showHelp);
  $('btnRoom').addEventListener('click', showRoom);
  $('btnRank').addEventListener('click', function () { showRank('region'); });
  $('btnDesktop').addEventListener('click', () => toast('添加到主屏幕即可离线游玩'));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') doHint(false);
    else if (e.key === 'r' || e.key === 'R') startLevel(state.levelId);
    else if (e.key === 'Escape') {
      if (sweepMode) { cancelSweep(); return; }
      if (dialog.open) closeDialog(); else showPause();
    }
  });

  function doHint(auto) {
    if (!state || ended || paused) return;
    const rec = recommend();
    if (!rec) { toast('暂时没有找到更优路线，先动动眼前这枚'); return; }
    if (hintStage === 0) {
      hintBoardId = rec.board;
      hintStage = 1;
      if (!auto) $('inlineStatus') && showInline('先观察这块木板，再点一次定位螺丝');
    } else {
      hintScrewId = rec.screw;
      hintStage = 2;
      state.assists.hint += 1;
      if (!auto) showInline('试着拆下这枚，注意槽位顺序');
      setTimeout(clearHint, 2600);
    }
  }

  function recommend() {
    const level = getLevel(state.levelId);
    const avail = core.availableScrews(state, renderer.poseProvider);
    if (level && level.solution) {
      for (const sid of level.solution) {
        const s = core.screwOf(state, sid);
        if (s && s.place === 'board' && avail.some((a) => a.id === sid)) {
          const b = core.boardOf(state, s.board);
          return { screw: sid, board: b.id };
        }
      }
    }
    if (!avail.length) return null;
    return { screw: avail[0].id, board: core.boardOf(state, avail[0].board).id };
  }

  function clearHint() {
    hintStage = 0;
    hintBoardId = hintScrewId = null;
  }

  let inlineTimer = null;
  function showInline(text) {
    const el = $('inlineStatus');
    if (!text) { el.classList.remove('visible'); clearTimeout(inlineTimer); return; }
    el.textContent = text;
    el.classList.add('visible');
    clearTimeout(inlineTimer);
    inlineTimer = setTimeout(() => el.classList.remove('visible'), 2400);
  }

  let toastTimer = null;
  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ------------------------------ 结算 ------------------------------ */
  function onWin() {
    ended = true;
    const first = !profile.cleared.includes(state.levelId);
    if (first) {
      profile.cleared.push(state.levelId);
      profile.cleared.sort((a, b) => a - b);
      profile.unlocked = Math.min(20, Math.max(profile.unlocked, state.levelId + 1));
      // 首次通关奖励：道具各 +1，培养「过关=有收获」的循环
      profile.items.sweep += 1;
      profile.items.peek += 1;
      lastWinReward = '首次通关奖励：移出 ×1 · 透视 ×1 已放入道具箱';
    } else {
      profile.items.peek += 1;
      lastWinReward = '通关奖励：透视 ×1 已放入道具箱';
    }
    const prev = profile.best[state.levelId];
    const rec = { ms: Math.round(elapsed), hints: state.assists.hint };
    if (!prev || rec.hints < prev.hints || (rec.hints === prev.hints && rec.ms < prev.ms)) profile.best[state.levelId] = rec;
    saveProfile();
    updateUI();
    setTimeout(() => showWon(first), 900);
  }

  function onLose() {
    ended = true;
    setTimeout(showLost, 600);
  }

  function setDialog(kind, html) {
    inner.innerHTML = html;
    dialog.dataset.kind = kind;
    if (!dialog.open) dialog.showModal();
    inner.querySelectorAll('[data-action]').forEach((el) => {
      el.addEventListener('click', (ev) => {
        const action = el.getAttribute('data-action');
        handleAction(action, el);
      });
    });
  }
  function closeDialog() {
    if (dialog.open) dialog.close();
    // 部分内核（headless Chromium / 个别 X5）close() 不派发 close 事件，这里同步兜底
    paused = false;
    regionPicking = false;
    payRevive = false;
  }
  const esc2 = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (n) => '<svg class="icon" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  const btn = (label, action, cls, ic) => '<button class="button ' + (cls || 'soft') + '" data-action="' + action + '">' + (ic ? icon(ic) : '') + label + '</button>';
  const closeBtn = () => '<button class="dialog-close" data-action="close" aria-label="关闭">' + icon('close') + '</button>';

  function handleAction(action, el) {
    switch (action) {
      case 'close': closeDialog(); paused = false; regionPicking = false; break;
      case 'next': closeDialog(); startLevel(state.levelId + 1); break;
      case 'replay': closeDialog(); startLevel(state.levelId); break;
      case 'levels': showLevels(); break;
      case 'help': showHelp(); break;
      case 'room': showRoom(); break;
      case 'rank': showRank('region'); break;
      case 'rank-level': showRank('level'); break;
      case 'rank-tab': rankTab = el.getAttribute('data-tab'); regionPicking = false; showRank(); break;
      case 'pick-region': regionPicking = true; showRank('region'); break;
      case 'set-region': profile.region = el.getAttribute('data-region'); regionPicking = false; saveProfile(); showRank('region'); break;
      case 'undo':
        if (!core.canUndo(state)) { toast('本关撤回次数已用完，重开本关吧'); break; }
        closeDialog();
        ended = false;
        $('btnUndo').click();
        break;
      case 'prev-chapter': viewChapter = Math.max(0, viewChapter - 1); showLevels(); break;
      case 'next-chapter': viewChapter = Math.min(3, viewChapter + 1); showLevels(); break;
      case 'shop': showShop(); break;
      case 'use-item': {
        const it = el.getAttribute('data-item');
        closeDialog();
        if (it === 'sweep') { if (sweepMode) cancelSweep(); else beginSweep(); }
        else if (it === 'peek') usePeek();
        break;
      }
      case 'free-ad': showAd(el.getAttribute('data-item'), false); break;
      case 'ad-revive': showAd('sweep', true); break;
      case 'ad-revive-done': closeDialog(); reviveSel = []; showLost(); break;
      case 'share-revive': showShare('sweep', true); break;
      case 'share-confirm': confirmShare(); break;
      case 'share-done': closeDialog(); reviveSel = []; showLost(); break;
      case 'buy': showPay(el.getAttribute('data-item')); break;
      case 'buy-revive': showPay('sweep', true); break;
      case 'pay-confirm': confirmPay(el); break;
      case 'cancel-pay': payRevive = false; showShop(); break;
      case 'pay-done':
        if (payRevive && state && state.status === 'lost') { payRevive = false; reviveSel = []; showLost(); }
        else { payRevive = false; showShop(); }
        break;
      case 'revive-pick': {
        const id = el.getAttribute('data-screw');
        const at = reviveSel.indexOf(id);
        if (at !== -1) reviveSel.splice(at, 1);
        else if (reviveSel.length < 2) reviveSel.push(id);
        showLost();
        break;
      }
      case 'revive-confirm': doRevive(); break;
    }
  }

  function showWon(first) {
    const lv = state.levelId;
    const board = buildLevelBoard(lv);
    const myRow = board.filter(function (r) { return r.me; })[0];
    const isFinal = lv === 20 && profile.cleared.length === 20;
    const title = isFinal ? '小屋完工，小橘猫入住！' : lv === 20 ? '终关机关完成！' : lv === 1 ? (profile.cleared.includes(1) && profile.best[1] ? '第1关完成！' : '第1关完成！') : '第 ' + lv + ' 关完成！';
    const decorCount = profile.cleared.length;
    const newFurniture = first ? FURNISHINGS[decorCount - 1] : null;
    setDialog('won',
      '<p class="dialog-kicker">第 ' + lv + ' 关完成</p>' +
      '<h1>' + title + '</h1>' +
      '<div class="stats-strip">' +
      '<div class="stat"><strong>' + clock(elapsed) + '</strong><small>本关用时</small></div>' +
      '<div class="stat"><strong>' + state.total / 2 + '</strong><small>相邻配对</small></div>' +
      '<div class="stat"><strong>' + state.assists.hint + '</strong><small>提示次数</small></div>' +
      '</div>' +
      '<div class="reward-line">' + (newFurniture ? '小屋添置了「' + esc2(newFurniture) + '」' : '再次完成！通关记录已保留。') + '</div>' +
      (lastWinReward ? '<p class="room-progress-note" style="text-align:center;font-size:12px;color:#8a653a;font-weight:700;margin:6px 0 0">🎁 ' + lastWinReward + '</p>' : '') +
      '<p class="room-progress-note" style="text-align:center;font-size:12px;color:#59734d;margin:8px 0">已添置 ' + decorCount + ' / 20 件摆设' + (decorCount < 20 ? ' · 再完成 ' + Math.max(1, decorCount - profile.cleared.length + 1) + ' 个新关卡' : '') + '</p>' +
      '<div class="modal-actions">' +
      (myRow ? '<button class="rank-callout" data-action="rank-level">本关排名第 ' + myRow.rank + ' 名 · 看看排行榜 ›</button>' : '') +
      (lv < 20 ? btn('挑战第 ' + (lv + 1) + ' 关', 'next', 'primary', 'play') : btn('回看全部关卡', 'levels', 'primary', 'levels')) +
      '<div class="action-row">' + btn('查看小屋', 'room', 'soft', 'home') + btn('重玩这一关', 'replay', 'soft', 'restart') + '</div>' +
      '</div>' +
      '<p class="fine-print">固定四格 · 道具不改变评级成绩<br>广告与付费均为模拟演示，不产生真实扣款</p>');
  }

  function showLost() {
    const key = state.levelId + '|' + state.moves + '|' + state.tray.join(',');
    const cached = rescueCache && rescueCache.key === key ? rescueCache.result : null;
    if (!cached && !rescuePending) {
      rescuePending = true;
      // 判定要跑一次有限搜索，先让弹窗出来，算完再补（大关卡约 200ms）
      setTimeout(function () {
        rescuePending = false;
        if (!state || state.status !== 'lost' || dialog.dataset.kind !== 'lost') return;
        rescueCache = {
          key: state.levelId + '|' + state.moves + '|' + state.tray.join(','),
          result: core.canRescue(state)
        };
        showLost();
      }, 40);
    }
    const rescue = cached;
    const hopeless = !!rescue && rescue.reason === 'no-rescue';
    const canRevive = state.status === 'lost' && profile.items.sweep > 0;
    reviveSel = reviveSel.filter((id) => state.tray.indexOf(id) !== -1).slice(0, 2);
    const trayHtml = state.tray.map((id, i) => {
      const s = core.screwOf(state, id);
      const c = COLORS[s.color];
      const picked = reviveSel.indexOf(id) !== -1;
      const act = canRevive && !hopeless ? ' data-action="revive-pick" data-screw="' + id + '"' : '';
      return '<button class="lost-tray-slot' + (picked ? ' picked' : '') + '"' + act + ' style="--dot:' + c.fill + '" aria-label="第' + (i + 1) + '格 ' + c.name + c.symbol + '">' + c.symbol + '</button>';
    }).join('');
    const pct = Math.round((state.matched / state.total) * 100);
    let reviveArea = '';
    const shareQuota = shareLeft();
    if (!rescue) {
      reviveArea = '<p class="fine-print">正在确认这局还有没有救…</p>';
    } else if (hopeless) {
      reviveArea =
        '<div class="hopeless-note">槽里的螺丝互相卡死了：同色被别的颜色隔开，再移出也配不成对子。</div>' +
        '<p class="fine-print">' + (core.canUndo(state) ? '道具救不回这一局，撤回上一步或重开更快。' : '道具救不回这一局，撤回次数也已用完，只能重开本关。') + '</p>';
    } else if (canRevive) {
      reviveArea =
        '<p class="fine-print" style="margin-top:10px">点选两枚螺丝，它们会移到棋盘外的配件区，随时能取回</p>' +
        (reviveSel.length === 2
          ? btn('确认复活 · 用 1 个移出道具', 'revive-confirm', 'primary', 'play')
          : '<button class="button" style="opacity:.55" disabled>选中 2 枚螺丝后复活（剩 ' + profile.items.sweep + ' 个道具）</button>') +
        (shareQuota > 0 ? '<button class="rank-callout" data-action="share-revive">📤 分享给好友，再领 1 个移出（今日剩 ' + shareQuota + ' 次）</button>' : '');
    } else if (state.status === 'lost') {
      reviveArea =
        (shareQuota > 0
          ? '<button class="button primary" data-action="share-revive">📤 分享给好友 · 得移出×1</button>'
          : '<button class="button" style="opacity:.55" disabled>今日分享奖励已领完</button>') +
        '<button class="button gold" data-action="ad-revive">📺 看广告免费复活</button>' +
        '<button class="button soft" data-action="buy-revive">' + icon('shop') + '¥1 购买移出并复活</button>' +
        '<p class="fine-print">复活后选两枚螺丝移到配件区，它们停在那里随时可取回，不会卡在棋盘上</p>';
    }
    setDialog('lost',
      '<div class="dialog-mascot">🙀</div>' +
      '<h1>' + (hopeless ? '四格已满 · 这局卡死了' : '四格已满') + '</h1>' +
      '<p class="loss-progress">已消除 ' + state.matched + ' / ' + state.total + ' 枚 · ' + pct + '%</p>' +
      '<div class="lost-tray" aria-label="失败时的暂存顺序">' + trayHtml + '</div>' +
      (canRevive && !hopeless ? '' : '<p class="fine-print">进入顺序 → 最后一枚已描边</p>') +
      '<div class="modal-actions">' +
      reviveArea +
      (state.history.length
        ? (core.canUndo(state)
          ? btn('撤回上一步 · 剩 ' + core.undoLeft(state) + ' 次', 'undo', reviveArea ? 'soft' : 'primary', 'restart')
          : '<button class="button" style="opacity:.55" disabled>撤回次数已用完（每关 ' + core.UNDO_LIMIT + ' 次）</button>')
        : '') +
      btn('重新开始本关', 'replay', !reviveArea && state.history.length ? 'soft' : 'primary', 'restart') +
      '<div class="action-row">' + btn('返回关卡', 'levels', 'soft', 'levels') + '</div>' +
      '</div>');
  }

  let viewChapter = 0;
  function showLevels() {

  const RANK_NICKS = ['橘猫饲养员','拆家小队长','木工阿吉','拧螺丝的鱼','螺丝收藏家','午后木屑','一只小板凳','手工课代表','钉子户本户','扳手小张','木屋守夜人','小橘猫邻居','螺丝转不停','爱拆家的小熊','工具袋','橡果工坊','深夜修屋','木匠学徒','螺丝松了','榫卯爱好者','一颗螺丝','小屋装修队','拆家不认输','指甲刀先生','铁锤妹妹','刨花','木纹控','下午三点的猫','咔哒咔哒','拆解大师','工具箱二代','斜杠木匠','三百目砂纸','螺丝星人','木屋保洁','橘猫罐头','螺丝钉先生','小锤四十','钉子小队长','木工房老板'];
  const PROVINCES = [
    ['广东',100],['江苏',93],['浙江',90],['山东',86],['河南',82],['四川',78],['湖北',72],['湖南',70],

    ['云南',46],['贵州',44],['黑龙江',42],['吉林',38],['内蒙古',36],['新疆',34],['甘肃',30],['海南',28],
    ['宁夏',24],['青海',20],['西藏',16],['北京',60],['上海',62],['天津',40],['重庆',56],
    ['中国香港',26],['中国澳门',14],['中国台湾',32]

  let rankTab = 'region';

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function dayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function rngFor(key) { return mulberry32(hashStr(dayKey() + '|' + key)); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtMs(ms) { const s = Math.max(0, Math.round(ms / 1000)); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
  function pickNames(rnd, count) {
    const used = {};
    const out = [];
    while (out.length < count) {
      const n = RANK_NICKS[Math.floor(rnd() * RANK_NICKS.length)];
      if (used[n]) continue;
      used[n] = 1;
      out.push(n);
    }
    return out;
  }

  function buildRegionBoard() {
    const rnd = rngFor('region');
    const mine = profile.region || '';
    const list = PROVINCES.map(function (p) {
      const base = Math.round(p[1] * (0.55 + rnd() * 0.9) * 11);
      return { name: p[0], count: base + (p[0] === mine && profile.cleared.length ? 1 : 0), me: p[0] === mine };
    });
    list.sort(function (a, b) { return b.count - a.count; });
    list.forEach(function (it, i) { it.rank = i + 1; });
    return list;
  }

  function buildLevelBoard(levelId) {
    const rnd = rngFor('lv' + levelId);
    const names = pickNames(rnd, 11);
    const list = names.map(function (name) {
      const dice = rnd();
      const hints = dice < 0.4 ? 0 : dice < 0.76 ? 1 : dice < 0.93 ? 2 : 3;
      const ms = Math.round((55 + rnd() * 185 + hints * 24) * 1000);
      return { name: name, hints: hints, ms: ms };
    });
    const mine = profile.best[levelId];
    if (mine) list.push({ name: '我', hints: mine.hints, ms: mine.ms, me: true });
    list.sort(function (a, b) { return a.hints - b.hints || a.ms - b.ms; });
    list.forEach(function (it, i) { it.rank = i + 1; });
    return list;
  }

  function buildTotalBoard() {
    const rnd = rngFor('total');
    const names = pickNames(rnd, 11);
    const list = names.map(function (name) {
      const cleared = 20 - Math.floor(rnd() * 12);
      const zero = Math.floor(rnd() * (cleared * 0.45 + 1));
      const ms = Math.round((cleared * 78 + rnd() * 880) * 1000);
      return { name: name, cleared: cleared, zero: zero, ms: ms };
    });
    const myCleared = profile.cleared.length;
    if (myCleared > 0) {
      let zero = 0;
      let ms = 0;
      Object.keys(profile.best).forEach(function (k) {
        if (profile.best[k].hints === 0) zero += 1;
        ms += profile.best[k].ms || 0;
      });
      list.push({ name: '我', cleared: myCleared, zero: zero, ms: ms, me: true });
    }
    list.sort(function (a, b) { return b.cleared - a.cleared || b.zero - a.zero || a.ms - b.ms; });
    list.forEach(function (it, i) { it.rank = i + 1; });
    return list;
  }

    return '<div class="rank-row' + (item.me ? ' me' : '') + '">' +

  }

      '<span class="shop-info"><strong>超值礼包 ¥1</strong><small>移出 ×3 + 透视 ×3 · 共 6 个，相当于单个 1.7 折</small></span>' +
      '<button class="buy-button" data-action="buy" data-item="bundle">¥1 购买</button></div>' +
      '<div class="modal-actions">' + btn('回到游戏', 'close', 'primary', 'play') + '</div>' +
      '<p class="fine-print">不花钱也能畅玩：道具来自每日福利、通关奖励、看广告和分享好友<br>广告与付费均为模拟演示，正式版接入微信激励视频与支付</p>');
  }

  /* 模拟激励视频：3 秒倒计时 → 道具到账 */
  let adCtx = { item: 'sweep', revive: false };
  function showAd(itemId, reviveAfter) {
    if (adLeft() <= 0) { toast('今日免费名额已用完，明天再来'); return; }
    if (state && state.status === 'playing') paused = true;
    adCtx = { item: itemId || 'sweep', revive: !!reviveAfter };
    const mName = PROP_META[adCtx.item] ? PROP_META[adCtx.item].name : '道具';
    setDialog('ad',
      closeBtn() +
      '<p class="dialog-kicker">模拟激励视频 · 看完即得</p>' +
      '<h1 style="font-size:22px">广告播放中…</h1>' +
      '<div class="ad-stage"><div class="ad-mascot">📺</div>' +
      '<div class="ad-progress"><div class="ad-bar" id="adBar"></div></div>' +
      '<p class="ad-count" id="adCount">3.0 秒</p></div>' +
      '<p class="fine-print">观看完毕即可领取 ' + mName + ' ×1<br>正式版接入微信激励视频广告</p>');
    const t0 = Date.now();
    const DUR = 3000;
    const iv = setInterval(function () {
      if (!dialog.open || dialog.dataset.kind !== 'ad') { clearInterval(iv); return; }
      const k = Math.min(1, (Date.now() - t0) / DUR);
      const bar = document.getElementById('adBar');
      if (bar) bar.style.width = (k * 100).toFixed(1) + '%';
      const c = document.getElementById('adCount');
      if (c) c.textContent = ((DUR / 1000) * (1 - k)).toFixed(1) + ' 秒';
      if (k >= 1) {
        clearInterval(iv);
        profile.items[adCtx.item] = (profile.items[adCtx.item] || 0) + 1;
        profile.ad = { date: todayKey(), count: (profile.ad && profile.ad.date === todayKey() ? profile.ad.count : 0) + 1 };
        saveProfile();
        updateUI();
        const after = adCtx.revive ? '<br>现在去选两枚螺丝复活吧' : '<br>今日还可免费领 ' + adLeft() + ' 次';
        setDialog('ad',
          '<div class="dialog-mascot">🎁</div>' +
          '<h1>道具到账</h1>' +
          '<p class="dialog-subtitle">' + mName + ' ×1 已放入道具箱' + after + '</p>' +
          '<div class="modal-actions">' + (adCtx.revive ? btn('去复活', 'ad-revive-done', 'primary', 'play') : btn('收下', 'close', 'primary', 'play')) + '</div>');
      }
    }, 100);
  }

  /* 分享给好友得道具：每次失败可领 1 份，日上限 3 次（模拟分享，正式版接 wx.shareAppMessage） */
  let shareCtx = { item: 'sweep', revive: false };
  function showShare(itemId, reviveAfter) {
    if (shareLeft() <= 0) { toast('今日分享奖励已领完，明天再来'); return; }
    if (state && state.status === 'playing') paused = true;
    shareCtx = { item: itemId || 'sweep', revive: !!reviveAfter };
    const mName = PROP_META[shareCtx.item] ? PROP_META[shareCtx.item].name : '道具';
    setDialog('share',
      closeBtn() +
      '<div class="dialog-mascot">🤝</div>' +
      '<h1 style="font-size:22px">分享给好友</h1>' +
      '<p class="dialog-subtitle">分享到微信好友或群聊<br>立刻获得 ' + mName + ' ×1 · 今日还剩 ' + shareLeft() + ' 次</p>' +
      '<div class="modal-actions">' +
      '<button class="button primary" data-action="share-confirm">📤 分享给好友</button>' +
      '<button class="button soft" data-action="close">先不分享</button>' +
      '</div>' +
      '<p class="fine-print">正式版通过微信分享卡片发放，好友点开也能领一份</p>');
  }

  function confirmShare() {
    setDialog('share',
      '<div class="dialog-mascot">📤</div>' +
      '<div class="pay-spinner"></div>' +
      '<p class="pay-wait">正在生成邀请卡片…</p>');
    setTimeout(function () {
      if (!dialog.open || dialog.dataset.kind !== 'share') return;
      const item = shareCtx.item;
      profile.items[item] = (profile.items[item] || 0) + 1;
      profile.share = { date: todayKey(), count: (profile.share && profile.share.date === todayKey() ? profile.share.count : 0) + 1 };
      saveProfile();
      updateUI();
      const mName = PROP_META[item] ? PROP_META[item].name : '道具';
      setDialog('share',
        '<div class="dialog-mascot">🎁</div>' +
        '<h1>分享成功</h1>' +
        '<p class="dialog-subtitle">' + mName + ' ×1 已放入道具箱' +
        (shareCtx.revive ? '<br>现在去选两枚螺丝复活吧' : '<br>今日还可领 ' + shareLeft() + ' 次') + '</p>' +
        '<div class="modal-actions">' + (shareCtx.revive ? btn('去复活', 'share-done', 'primary', 'play') : btn('收下', 'close', 'primary', 'play')) + '</div>');
    }, 1200);
  }

  function showPay(itemId, reviveAfter) {
    const m = PROP_META[itemId];
    if (!m && itemId !== 'bundle') return;
    const name = itemId === 'bundle' ? '超值道具礼包（移出×3 + 透视×3）' : m.name + '道具 ×1';
    payRevive = !!reviveAfter;
    setDialog('pay',
      closeBtn() +
      '<p class="dialog-kicker">模拟微信支付 · 收银台</p>' +
      '<h1 style="font-size:22px">确认购买</h1>' +
      '<div class="pay-merchant"><span class="pay-logo">微</span>螺丝小屋 · ' + name + '</div>' +
      '<div class="pay-amount">¥ 1.00</div>' +
      '<p class="pay-note">购买后立即到账，库存保存在本机存档</p>' +
      '<div class="modal-actions">' +
      '<button class="button primary" data-action="pay-confirm" data-item="' + itemId + '">确认支付 ¥1.00</button>' +
      '<button class="button soft" data-action="cancel-pay">取消</button>' +
      '</div>' +
      '<p class="fine-print">模拟支付，不会真实扣款</p>');
  }

  function confirmPay(el) {
    const itemId = el.getAttribute('data-item');
    if (itemId !== 'bundle' && !PROP_META[itemId]) return;
    setDialog('pay',
      '<div class="dialog-mascot">💬</div>' +
      '<div class="pay-spinner"></div>' +
      '<p class="pay-wait">正在拉起支付，请稍候…</p>');
    setTimeout(function () {
      if (!dialog.open || dialog.dataset.kind !== 'pay') { payRevive = false; return; }
      let granted;
      if (itemId === 'bundle') {
        profile.items.sweep += 3;
        profile.items.peek += 3;
        granted = '超值礼包已到账：移出 ×3 · 透视 ×3';
      } else {
        profile.items[itemId] = (profile.items[itemId] || 0) + 1;
        granted = PROP_META[itemId].name + '道具 +1 · 感谢惠顾修理铺';
      }
      saveProfile();
      updateUI();
      setDialog('pay',
        '<div class="dialog-mascot">✅</div>' +
        '<h1>支付成功</h1>' +
        '<p class="dialog-subtitle">' + granted +
        (payRevive ? '<br>现在就去选择要移出的螺丝吧' : '') + '</p>' +
        '<div class="modal-actions">' + btn('好的', 'pay-done', 'primary', 'play') + '</div>');
    }, 1100);
  }

  function doRevive() {
    if (!state || state.status !== 'lost' || reviveSel.length !== 2) return;
    const res = core.sweep(state, reviveSel.slice());
    if (!res.ok) { toast('复活失败：' + (res.reason || '未知原因')); return; }
    profile.items.sweep -= 1;
    saveProfile();
    reviveSel = [];
    ended = false;
    paused = false;
    renderer.reset();
    renderer.sync(state, res.events);
    for (const b of state.boards) {
      if (b.status === 'hinged') renderer.poses[b.id] = { x: b.x, y: b.y, angle: b.angle };
    }
    clearHint();
    updateUI();
    closeDialog();
    if (state.status === 'won') { onWin(false); return; }
    toast('复活成功！两枚已移到配件区，点它们随时放回暂存槽');
  }


  /* ------------------------------ 尺寸自适应 ------------------------------ */
  function layout() {
    const surface = canvas.parentElement;
    const rect = surface.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    renderer.resize(rect.width, rect.height, dpr);
  }
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(canvas.parentElement);

  /* ------------------------------ 启动 ------------------------------ */
  layout();
  startLevel(profile.unlocked > 1 ? profile.unlocked : 1);
  if (checkDailyGift()) setTimeout(() => toast('每日福利到账：移出 +1 · 透视 +1'), 600);
  idleSince = performance.now();
  requestAnimationFrame((t) => { lastFrame = t; requestAnimationFrame(frame); });

  /* 自动化测试钩子（原型用）：读状态 / 直接点螺丝 / 走提示 */
  window.__screw = {
    state: () => state,
    screws: () => state.screws.map((s) => ({ id: s.id, color: s.color, place: s.place, ...core.screwPos(state, s, renderer.poseProvider) })),
    boards: () => state.boards.map((b) => ({ id: b.id, status: b.status, x: Math.round(b.x), y: Math.round(b.y), angle: +b.angle.toFixed(3), omega: +b.omega.toFixed(3) })),
    tap: (id) => {
      const res = core.tap(state, id, renderer.poseProvider);
      if (res.ok) { renderer.sync(state, res.events); updateUI(); if (state.status === 'won') onWin(); else if (state.status === 'lost') onLose(); }
      return res;
    },
    hint: () => doHint(false),
    rank: (t) => { showRank(t || 'region'); return { tab: rankTab, region: profile.region }; },
    profile: () => profile,
    renderer: () => renderer,
    poses: () => renderer.poses,
    swings: () => renderer.swings,
    undo: () => { const before = core.undoLeft(state); $('btnUndo').click(); return { ok: core.undoLeft(state) < before, left: core.undoLeft(state) }; },
    status: () => ({ tray: state.tray.length, matched: state.matched, total: state.total, status: state.status, hints: state.assists.hint, undos: state.undos, undoLeft: core.undoLeft(state) }),
    items: () => profile.items,
    buy: (key, n) => { profile.items[key] = (profile.items[key] || 0) + (n || 1); saveProfile(); updateUI(); return profile.items; },
    sweep: (ids) => {
      const r = core.sweep(state, ids);
      if (r.ok) { renderer.reset(); renderer.sync(state, r.events); for (const b of state.boards) { if (b.status === 'hinged') renderer.poses[b.id] = { x: b.x, y: b.y, angle: b.angle }; } updateUI(); }
      return r;
    },
    takeSpare: (id) => {
      const r = core.takeSpare(state, id);
      if (r.ok) { renderer.sync(state, r.events); updateUI(); }
      return r;
    },
    spare: () => state.spare.slice(),
    rescue: (opt) => core.canRescue(state, opt),
    sweepMode: (on) => { if (on) beginSweep(); else cancelSweep(); return { mode: sweepMode, sel: sweepSel }; },
    debug: () => ({ paused, ended, sweepMode, status: state && state.status, tray: state && state.tray.length, spare: state && state.spare.length }),
    share: (item) => { showShare(item || 'sweep', false); return { left: shareLeft() }; },
    shareLeft: () => shareLeft(),
    lost: () => { showLost(); return { kind: dialog.dataset.kind, canShare: !!document.querySelector('[data-action=share-revive]'), hopeless: !!document.querySelector('.hopeless-note') }; },
    peek: () => { usePeek(); return { until: peekUntil - performance.now() }; }
  };
})();
</script>
</body>
</html>
